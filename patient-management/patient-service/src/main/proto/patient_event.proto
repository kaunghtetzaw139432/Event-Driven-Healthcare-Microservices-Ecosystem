syntax = "proto3";

package com.pm.patientservice.event;


option java_multiple_files = true;
option java_package = "com.pm.patientservice.event";
option java_outer_classname = "PatientEventProto";

message PatientEvent {
  string patient_id = 1;
  string name = 2;
  string email = 3;
  string event_type = 4;
  int64 timestamp = 5;
}